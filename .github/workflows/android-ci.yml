name: android-ci

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: newer ubuntu-24.04 runner images ship NO Android SDK, and
      # android-actions/setup-android@v3 is broken upstream (it runs
      # `sdkmanager tools`, a package Google removed). So we install the SDK
      # deterministically from Google's official cmdline-tools zip.
      - name: Android SDK (cmdline-tools + NDK + CMake)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle setup (official action, wrapper-free capable)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Provision wrapper if missing
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build + unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease testDebugUnitTest :terminal-emulator:test --stacktrace 2>&1 | tee gradle-build.log

      - name: Surface gradle failures
        if: failure()
        run: |
          grep -E "^e: |> Task .*FAILED|BUILD FAILED|Compilation error|FAILED" gradle-build.log \
            | head -30 | while IFS= read -r line; do echo "::error title=gradle::$line"; done
          sed -n '/\* What went wrong/,/\* Try:/p' gradle-build.log | head -25 \
            | while IFS= read -r line; do echo "::error title=gradle-cause::$line"; done
          grep -E "tests? (completed|failed)|There (was|were) .* failures" gradle-build.log \
            | head -10 | while IFS= read -r line; do echo "::error title=test-summary::$line"; done

      - name: Verify debug APK application ID
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep -F "package: name='com.crossberry.noxs'" >/dev/null

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noxs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/

  rootfs-validation:
    name: Bootstrap + filesystem security validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate manifests, sync, shell tooling
        run: |
          chmod +x scripts/*.sh linux-runtime/**/*.sh 2>/dev/null || true
          set -o pipefail
          for suite in manifests sync-check scripts nx ai code; do
            echo "=== suite: $suite ==="
            if scripts/test.sh "--$suite" 2>&1 | tee "validate-$suite.log"; then
              echo "SUITE $suite: PASS"
            else
              echo "SUITE $suite: FAIL"
              grep -E "FAILED|BAD |Traceback|error|Error|DIFF" "validate-$suite.log" | head -20 \
                | while IFS= read -r line; do echo "::error title=validation [$suite]::$line"; done
              tail -n 15 "validate-$suite.log"
              exit 1
            fi
          done

      - name: Filesystem security tests (JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configuring :app pulls in the Android plugin, which wants the SDK +
      # NDK at configuration time — runner images ship neither anymore.
      - name: Android SDK (cmdline-tools + NDK + CMake)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run security-focused unit tests
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7; fi
          set -o pipefail
          ./gradlew noxs-shared:test terminal-emulator:test 2>&1 | tee security-tests.log

      - name: Surface security test failures
        if: failure()
        run: |
          grep -E "^e: |> Task .*FAILED|FAILED|What went wrong|tests? failed|Compilation error" security-tests.log \
            | head -30 | while IFS= read -r line; do echo "::error title=security-tests::$line"; done
          sed -n '/\* What went wrong/,/\* Try:/p' security-tests.log | head -25 \
            | while IFS= read -r line; do echo "::error title=security-cause::$line"; done

  rust-core:
    name: Rust core (noxs-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: noxs-core-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Test (zero dependencies — builds offline)
        working-directory: rust
        run: cargo test --locked 2>/dev/null || cargo test

      - name: Clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings 2>/dev/null || cargo clippy --all-targets

      - name: Build cdylib
        working-directory: rust
        run: cargo build --release

  release:
    name: Release (signed APK)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android-build, rootfs-validation, rust-core ]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only ("Resource not accessible by
    # integration") — creating a Release requires contents:write.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version from tag
        id: release_version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.1.8; got $TAG" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2147483647 )); then
            echo "Tag maps outside the valid Android versionCode range: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (versionCode=$VERSION_CODE)"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship no Android SDK anymore — install it (see android-build note)
      - name: Android SDK (cmdline-tools + NDK + CMake)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          NOXS_KEYSTORE_B64: ${{ secrets.NOXS_KEYSTORE_B64 }}
        run: |
          if [ -n "$NOXS_KEYSTORE_B64" ]; then
            echo "$NOXS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noxs.keystore"
            echo "NOXS_KEYSTORE_FILE=$RUNNER_TEMP/noxs.keystore" >> "$GITHUB_ENV"
          else
            echo "NOXS_KEYSTORE_FILE=" >> "$GITHUB_ENV"
          fi

      - name: Build tagged release APK
        env:
          NOXS_KEYSTORE_PASSWORD: ${{ secrets.NOXS_KEYSTORE_PASSWORD }}
          NOXS_KEY_ALIAS: ${{ secrets.NOXS_KEY_ALIAS }}
          NOXS_KEY_PASSWORD: ${{ secrets.NOXS_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release_version.outputs.code }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7; fi
          ./gradlew assembleRelease --stacktrace \
            -PnoxsVersionName="$RELEASE_VERSION" \
            -PnoxsVersionCode="$RELEASE_VERSION_CODE"

      - name: Verify package ID and stage versioned APK
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.crossberry.noxs'" >/dev/null
          mkdir -p release-assets
          cp "$APK" "release-assets/noxs-${RELEASE_VERSION}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noxs-${{ steps.release_version.outputs.version }}
          path: release-assets/noxs-${{ steps.release_version.outputs.version }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/noxs-${{ steps.release_version.outputs.version }}.apk
          generate_release_notes: true
