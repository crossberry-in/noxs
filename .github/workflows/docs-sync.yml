# Documentation synchronization pipeline (application repository side).
#
# Flow: push → drift/coverage validation → affected-pages mapping →
# optional review PR in crossberry-in/nxos-docs.
#
# Security:
#  - jobs run with least privilege (contents: read; the PR job gets
#    pull-requests: write only when a fine-grained token secret exists).
#  - The cross-repository token is stored ONLY as the DOCS_SYNC_TOKEN
#    Actions secret (fine-grained, scoped to nxos-docs, contents:write +
#    pull-requests:write). It never appears in code, logs or this file.
#  - Without the secret the workflow still runs validation and uploads the
#    coverage report — documentation review tasks are then listed in the
#    build log instead of a PR. No silent writes, ever.

name: docs-sync

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "linux-runtime/**"
      - "scripts/**"
      - "app/src/main/resources/documentation/**"
  pull_request:
    paths:
      - "app/**"
      - "linux-runtime/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_DOCS_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN != '' }}

jobs:
  validate:
    name: Validate documentation metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the deployed sitemap (live route verification)
        run: |
          curl -fsSL https://crossberry-in.github.io/nxos-docs/sitemap.xml -o /tmp/sitemap.xml
          wc -c /tmp/sitemap.xml
      - name: doc_sync check (metadata + CLI coverage + docs mapping + sitemap)
        run: python3 scripts/doc_sync.py check --sitemap /tmp/sitemap.xml
      - name: Documentation coverage report
        run: python3 scripts/doc_sync.py report | tee coverage-report.txt
      - name: Map changed files to affected documentation pages
        if: github.event_name == 'push'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          echo "Changed files:"; echo "$CHANGED"
          {
            echo "## Documentation sync report (${GITHUB_SHA})"
            echo
            echo "Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo
            python3 scripts/doc_sync.py report
            echo
            echo "### Affected documentation pages (review before release)"
            [ -n "$CHANGED" ] && python3 scripts/doc_sync.py affected $CHANGED || true
          } > docs-sync-report.md
          cat docs-sync-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: docs-sync-report
          path: |
            coverage-report.txt
            docs-sync-report.md
          if-no-files-found: ignore
          retention-days: 30

  docs-pr:
    name: Open documentation review PR
    needs: validate
    # Runs only when a fine-grained token is configured; otherwise the
    # validate job artifacts carry the review task list.
    if: github.event_name == 'push' && env.HAS_DOCS_TOKEN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute affected pages
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          python3 scripts/doc_sync.py affected $CHANGED > /tmp/affected.txt || true
          cat /tmp/affected.txt
      - name: Open review PR in nxos-docs (task list, never silent overwrites)
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          BRANCH="docs-sync/${SOURCE_SHA:0:12}"
          HEADER="Documentation sync task for noxs@${SOURCE_SHA:0:12}"
          {
            echo "$HEADER"
            echo
            echo "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"
            echo
            echo "Pages to review/update (mapped by scripts/doc_sync.py affected):"
            cat /tmp/affected.txt
            echo
            echo "This PR is a REVIEWABLE task list generated by automation."
            echo "It never overwrites documentation content without a human edit."
          } > /tmp/task.md
          git config --global user.name "noxs-docs-bot"
          git config --global user.email "crossberryweb@gmail.com"
          REPO="https://x-access-token:${DOCS_SYNC_TOKEN}@github.com/crossberry-in/nxos-docs.git"
          git clone --depth 1 "$REPO" /tmp/nxos-docs
          cd /tmp/nxos-docs
          git checkout -b "$BRANCH"
          mkdir -p _sync
          cp /tmp/task.md "_sync/${SOURCE_SHA:0:12}.md"
          git add _sync
          if git diff --cached --quiet; then
            echo "No documentation tasks to file."; exit 0
          fi
          git commit -m "docs-sync: review task for noxs@${SOURCE_SHA:0:12}"
          git push origin "$BRANCH"
          gh pr create \
            --repo crossberry-in/nxos-docs \
            --head "$BRANCH" \
            --title "docs-sync: review task for noxs@${SOURCE_SHA:0:12}" \
            --body-file /tmp/task.md || echo "PR already exists; skipped"
