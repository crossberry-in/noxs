<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="860" height="500" rx="14" fill="#10161d" stroke="#263241"/>
  <text x="40" y="54" font-size="20" font-weight="700" fill="#e8f5ee">Noxs architecture</text>
  <text x="40" y="76" font-size="12" fill="#8aa39b">One Android app · one real Debian 12 guest · no root, no sandbox bypass</text>

  <rect x="40" y="92" width="820" height="386" rx="12" fill="none" stroke="#4ade80" stroke-dasharray="6 5" opacity="0.55"/>
  <text x="52" y="112" font-size="12" fill="#4ade80">Android app sandbox — app UID, app-private storage (filesDir/noxs/)</text>

  <!-- module row -->
  <g font-size="11">
    <rect x="56" y="128" width="190" height="76" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="70" y="150" font-size="13" font-weight="700" fill="#4ade80">app</text>
    <text x="70" y="168" fill="#c7d6cf">UI · installer · services</text>
    <text x="70" y="184" fill="#c7d6cf">noxs-pty.c forkpty JNI</text>

    <rect x="256" y="128" width="190" height="76" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="270" y="150" font-size="13" font-weight="700" fill="#4ade80">terminal-view</text>
    <text x="270" y="168" fill="#c7d6cf">TerminalView · renderer</text>
    <text x="270" y="184" fill="#c7d6cf">shortcut-key row</text>

    <rect x="456" y="128" width="190" height="76" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="470" y="150" font-size="13" font-weight="700" fill="#4ade80">terminal-emulator</text>
    <text x="470" y="168" fill="#c7d6cf">clean-room VT/xterm</text>
    <text x="470" y="184" fill="#c7d6cf">engine (pure Kotlin)</text>

    <rect x="656" y="128" width="188" height="76" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="670" y="150" font-size="13" font-weight="700" fill="#4ade80">noxs-shared</text>
    <text x="670" y="168" fill="#c7d6cf">TarGuard · checksums</text>
    <text x="670" y="184" fill="#c7d6cf">users · quotas</text>
  </g>

  <!-- rust core -->
  <rect x="56" y="224" width="788" height="52" rx="10" fill="#18242f" stroke="#33465a"/>
  <text x="72" y="246" font-size="13" font-weight="700" fill="#4ade80">rust/noxs-core — performance core</text>
  <text x="72" y="264" font-size="11" fill="#c7d6cf">SHA-256 · tar safety walker · dependency resolver · task engine · stable C ABI (+ pure-Kotlin fallback)</text>

  <!-- proot -->
  <rect x="56" y="300" width="788" height="62" rx="10" fill="#1c2a20" stroke="#4ade80"/>
  <text x="72" y="324" font-size="13" font-weight="700" fill="#4ade80">proot 5.1.107.96 — bundled in the APK (jniLibs → nativeLibraryDir)</text>
  <text x="72" y="342" font-size="11" fill="#d7e8de">ptrace path virtualization · proot -0 -r rootfs --link2symlink · no namespaces, no root</text>

  <!-- debian guest -->
  <rect x="56" y="388" width="788" height="74" rx="10" fill="#14231a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="72" y="412" font-size="13" font-weight="700" fill="#4ade80">Debian 12 Bookworm userspace (arm64)</text>
  <text x="72" y="430" font-size="11" fill="#d7e8de">bash · APT · password-protected sudo · user noxs (/home/noxs) · full FHS</text>
  <text x="72" y="446" font-size="11" fill="#d7e8de">unix sockets in /run + /var/run · noxs CLI (nx alias) · code-server 127.0.0.1 only</text>

  <line x1="450" y1="276" x2="450" y2="298" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="362" x2="450" y2="386" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="502" font-size="11" fill="#8aa39b">Noxs never modifies the Android system, never bypasses SELinux, and never asks for root.</text>
</svg>
