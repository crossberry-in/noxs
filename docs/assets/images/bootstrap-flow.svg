<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="860" height="270" rx="14" fill="#10161d" stroke="#263241"/>
  <text x="40" y="54" font-size="20" font-weight="700" fill="#e8f5ee">First-launch bootstrap flow</text>
  <text x="40" y="76" font-size="12" fill="#8aa39b">SetupActivity — every network step verified, every extraction guarded</text>

  <g font-size="11">
    <rect x="40" y="96" width="260" height="80" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="56" y="118" font-size="13" font-weight="700" fill="#4ade80">01 · Architecture detection</text>
    <text x="56" y="136" fill="#c7d6cf">arm64-v8a priority, then x86_64,</text>
    <text x="56" y="152" fill="#c7d6cf">then armv7 (experimental)</text>

    <rect x="320" y="96" width="260" height="80" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="336" y="118" font-size="13" font-weight="700" fill="#4ade80">02 · Storage initialization</text>
    <text x="336" y="136" fill="#c7d6cf">filesDir/noxs/{rootfs,bin,run,</text>
    <text x="336" y="152" fill="#c7d6cf">cache,logs,tmp}</text>

    <rect x="600" y="96" width="260" height="80" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="616" y="118" font-size="13" font-weight="700" fill="#4ade80">03 · Manifest + proot check</text>
    <text x="616" y="136" fill="#c7d6cf">bootstrap.manifest per arch;</text>
    <text x="616" y="152" fill="#c7d6cf">proot bundled in APK — no network</text>

    <rect x="40" y="196" width="260" height="80" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="56" y="218" font-size="13" font-weight="700" fill="#4ade80">04 · Rootfs download + verify</text>
    <text x="56" y="236" fill="#c7d6cf">official Debian 12 rootfs, pinned</text>
    <text x="56" y="252" fill="#c7d6cf">SHA-256, 3 retries, staged rename</text>

    <rect x="320" y="196" width="260" height="80" rx="10" fill="#18242f" stroke="#33465a"/>
    <text x="336" y="218" font-size="13" font-weight="700" fill="#4ade80">05 · Safe extraction</text>
    <text x="336" y="236" fill="#c7d6cf">TarGuard: traversal / absolute /</text>
    <text x="336" y="252" fill="#c7d6cf">symlink / device / bomb defense</text>

    <rect x="600" y="196" width="260" height="80" rx="10" fill="#14231a" stroke="#4ade80" stroke-width="1.5"/>
    <text x="616" y="218" font-size="13" font-weight="700" fill="#4ade80">06 · Configure + first shell</text>
    <text x="616" y="236" fill="#d7e8de">FHS · user noxs + password sudo ·</text>
    <text x="616" y="252" fill="#d7e8de">/run init · signed APT init · bash</text>
  </g>

  <line x1="300" y1="136" x2="318" y2="136" stroke="#4ade80" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="580" y1="136" x2="598" y2="136" stroke="#4ade80" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M730 176 V 236 H 302" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="300" y1="236" x2="318" y2="236" stroke="#4ade80" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="580" y1="236" x2="598" y2="236" stroke="#4ade80" stroke-width="2" marker-end="url(#arr2)"/>
</svg>
